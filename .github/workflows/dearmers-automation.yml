name: Dearmers autonomous engine
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger production reconciliation
        run: |
          response="$(curl --fail-with-body --silent --show-error --max-time 55 \
            -X POST https://dreamersdao.me/api/automation \
            -H "x-internal-api-key: $INTERNAL_API_SECRET")"
          node -e 'const result=JSON.parse(process.argv[1]); if (!Array.isArray(result.errors)) process.exit(1); console.log(JSON.stringify({processed: result.processed, errors: result.errors.length, timestamp: result.timestamp})); if (result.errors.length) process.exit(1)' "$response"
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
